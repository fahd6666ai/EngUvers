# EngUvers local dev stack — one command brings up everything:
#   docker compose up --build
# apps/web -> http://localhost:3000
# apps/api -> http://localhost:4000 (health: /health)
#
# services/ai and services/simulator are not wired in here yet — they are
# scaffolded as placeholders (see their README.md) and join this file in
# Phase 4 / Phase 2 respectively.
services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-enguvers}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-enguvers_dev_password}
      POSTGRES_DB: ${POSTGRES_DB:-enguvers}
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-enguvers}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio:latest
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-enguvers}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-enguvers_dev_password}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 10

  meilisearch:
    image: getmeili/meilisearch:v1.11
    restart: unless-stopped
    environment:
      MEILI_MASTER_KEY: ${MEILI_MASTER_KEY:-enguvers_dev_master_key}
      MEILI_NO_ANALYTICS: "true"
    ports:
      - "7700:7700"
    volumes:
      - meili-data:/meili_data
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:7700/health"]
      interval: 10s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile.dev
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-enguvers}:${POSTGRES_PASSWORD:-enguvers_dev_password}@postgres:5432/${POSTGRES_DB:-enguvers}
      REDIS_URL: redis://redis:6379
      API_PORT: 4000
      JWT_SECRET: ${JWT_SECRET:-change-me-in-production}
      FRONTEND_URL: http://localhost:3000
    ports:
      - "4000:4000"
    volumes:
      - .:/repo
      - api-node-modules:/repo/node_modules
      - api-app-node-modules:/repo/apps/api/node_modules
      - types-node-modules:/repo/packages/types/node_modules

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile.dev
    restart: unless-stopped
    depends_on:
      - api
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:4000
    ports:
      - "3000:3000"
    volumes:
      - .:/repo
      - web-node-modules:/repo/node_modules
      - web-app-node-modules:/repo/apps/web/node_modules
      - ui-node-modules:/repo/packages/ui/node_modules
      - types-node-modules:/repo/packages/types/node_modules

volumes:
  postgres-data:
  minio-data:
  meili-data:
  api-node-modules:
  api-app-node-modules:
  web-node-modules:
  web-app-node-modules:
  ui-node-modules:
  types-node-modules:
