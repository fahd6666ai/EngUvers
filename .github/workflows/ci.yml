name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    env:
      # prisma validate only parses the schema; it never opens a
      # connection, but the CLI still requires the env var referenced by
      # `env("DATABASE_URL")` to be set.
      DATABASE_URL: postgresql://enguvers:enguvers@localhost:5432/enguvers
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile=false

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Validate Prisma schema
        run: pnpm --filter @enguvers/api exec prisma validate

      - name: Test
        run: pnpm test
